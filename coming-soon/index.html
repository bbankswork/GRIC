<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page in Progress | Gila River Police Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
.page-hero{min-height:560px}
.proto-note{max-width:640px;margin:0 auto;text-align:center}
.proto-note p{font-size:15px;line-height:1.7;color:rgba(255,255,255,.55)}
.proto-note .btn{margin-top:32px}
</style>
</head>
<body data-section="" data-root="../">

<div id="site-header"></div>

<section class="page-hero">
  <div class="bg"><img class="img-soonHero" alt=""></div>
  <div class="inner">
    <p class="eyebrow">Prototype Page in Progress</p>
    <h1 id="pageName">Coming Soon</h1>
  </div>
</section>

<section class="sec char">
  <div class="wrap proto-note">
    <p>This page is part of the GRPD site map and will be built once its content is ready. Use the menu to visit pages that are already in the prototype.</p>
    <a href="../" class="btn">Back to Home <span class="arr">→</span></a>
  </div>
</section>


<div id="site-footer"></div>

<script>
/* Set the page name from ?page= before the shared nav renders */
const name = new URLSearchParams(location.search).get('page') || 'Coming Soon';
document.getElementById('pageName').textContent = name;
document.title = name + ' | Gila River Police Department';
const SECTIONS = {};
document.body.dataset.section = Object.keys(SECTIONS).find(k => SECTIONS[k].includes(name)) || '';
</script>
<script src="../assets/site.js"></script>
</body>
</html>
